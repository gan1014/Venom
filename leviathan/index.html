<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#040406" />
  <title>LEGO LEVIATHAN — Build Beyond Limits</title>
  <meta name="description" content="A cinematic scroll experience. An original dark leviathan awakens. Build beyond limits." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23080a0c' width='32' height='32'/%3E%3Crect fill='%23c9ccd2' x='8' y='8' width='6' height='6' rx='1'/%3E%3Crect fill='%23c9ccd2' x='18' y='8' width='6' height='6' rx='1'/%3E%3Crect fill='%238b1c1c' x='8' y='18' width='16' height='6' rx='1'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="boot" aria-live="polite">
    <div class="boot-mark">
      <span class="boot-studs" aria-hidden="true">
        <i></i><i></i><i></i><i></i>
      </span>
      <p class="boot-kicker">Cinematic Symbiote Sequence</p>
      <h1 class="boot-title">LEVIATHAN</h1>
    </div>
    <div class="boot-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <i id="boot-fill"></i>
    </div>
    <p class="boot-status" id="boot-status">Assembling plates&hellip;</p>
    <button type="button" id="enter" class="enter" hidden>Enter the Foundry</button>
  </div>

  <div id="progress" aria-hidden="true"><i id="progress-fill"></i></div>

  <header class="chrome" aria-hidden="true">
    <span class="chrome-brand">LEGO LEVIATHAN</span>
    <span class="chrome-meta" id="chrome-meta">00 — THE FOUNDRY</span>
  </header>

  <nav class="ticks" id="ticks" aria-label="Chapters"></nav>

  <div id="stage">
    <canvas id="frames"></canvas>
    <canvas id="fx"></canvas>
    <div class="fog fog-a"></div>
    <div class="fog fog-b"></div>
    <div class="grade"></div>
    <div class="vignette"></div>
    <div class="grain"></div>
    <div class="letterbox top"></div>
    <div class="letterbox bot"></div>
    <div class="flash" id="flash"></div>
    <div class="ca"></div>

    <div id="caption">
      <p class="cap-kicker" id="cap-kicker">00</p>
      <p class="cap-title" id="cap-title">The Foundry</p>
      <p class="cap-line" id="cap-line">A drowned cathedral of steel</p>
    </div>

    <div id="hint">
      <span>Scroll to enter</span>
      <b></b>
    </div>

    <section id="title" aria-hidden="true">
      <div class="title-inner">
        <div class="brick-word" id="word-lego" aria-label="LEGO">
          <span class="cell" data-char="L"><em></em><b>L</b></span>
          <span class="cell" data-char="E"><em></em><b>E</b></span>
          <span class="cell" data-char="G"><em></em><b>G</b></span>
          <span class="cell" data-char="O"><em></em><b>O</b></span>
        </div>
        <h2 class="word-leviathan" id="word-leviathan">LEVIATHAN</h2>
        <p class="tagline" id="tagline"><span>Build Beyond Limits</span></p>
      </div>
    </section>
  </div>

  <div id="scroll-track"></div>

  <button type="button" id="audio-btn" class="audio-btn" aria-pressed="false" aria-label="Toggle sound" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path class="sp-on" d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/>
      <path class="sp-off" d="M4 9v6h4l5 4V5L8 9H4zm11.7-3.3 1.4 1.4L15.4 9l1.7 1.9-1.4 1.4L14 10.4l-1.7 1.9-1.4-1.4L12.6 9l-1.7-1.9 1.4-1.4L14 7.6l1.7-1.9z"/>
    </svg>
  </button>

  <script src="js/app.js"></script>
</body>
</html>
