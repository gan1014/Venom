<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LEGO LEVIATHON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=boot4" />
  <style>
    #carnage-wrap {
      position: fixed;
      left: 0; right: 0;
      bottom: 11vh;
      z-index: 90;
      display: none;
      justify-content: center;
      pointer-events: none;
    }
    body.is-title #carnage-wrap { display: flex; pointer-events: auto; }
    #carnage-btn {
      appearance: none;
      cursor: pointer;
      font-family: Inter, sans-serif;
      font-size: 12px;
      letter-spacing: 0.36em;
      text-transform: uppercase;
      text-decoration: none;
      color: #f6f3f1;
      border: 1px solid #c43a2a;
      padding: 16px 28px;
      background: rgba(8, 0, 0, 0.7);
      box-shadow: 0 0 36px rgba(196, 58, 42, 0.45);
    }
    #carnage-btn:hover { background: rgba(154, 31, 31, 0.35); }
  </style>
</head>
<body>
  <div id="boot" aria-live="polite">
    <div class="boot-bg" aria-hidden="true"></div>
    <div class="boot-veil" aria-hidden="true"></div>
    <div class="boot-grain" aria-hidden="true"></div>
    <div class="boot-scan" aria-hidden="true"></div>
    <div class="boot-lb top" aria-hidden="true"></div>
    <div class="boot-lb bot" aria-hidden="true"></div>
    <div class="boot-core">
      <div class="boot-frame">
        <i class="boot-c tl" aria-hidden="true"></i>
        <i class="boot-c tr" aria-hidden="true"></i>
        <i class="boot-c bl" aria-hidden="true"></i>
        <i class="boot-c br" aria-hidden="true"></i>
        <p class="boot-kicker">Cinematic Symbiote Sequence</p>
        <h1 class="boot-title">
          <img class="boot-word" src="assets/ui/title-lego-leviathon.png?v=2" alt="LEGO LEVIATHON" />
        </h1>
        <div class="boot-seal">
          <span class="boot-rule" aria-hidden="true"></span>
          <p class="boot-status" id="boot-status">Assembling plates&hellip;</p>
          <span class="boot-rule" aria-hidden="true"></span>
        </div>
        <div class="boot-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <i id="boot-fill"></i>
        </div>
        <button type="button" id="enter" class="enter" disabled>Enter the Foundry</button>
      </div>
    </div>
  </div>

  <div id="progress" aria-hidden="true"><i id="progress-fill"></i></div>

  <header class="chrome" aria-hidden="true">
    <span class="chrome-brand">LEGO LEVIATHON</span>
    <span class="chrome-meta" id="chrome-meta">00 — THE FOUNDRY</span>
  </header>

  <nav class="ticks" id="ticks" aria-label="Chapters"></nav>

  <div id="stage">
    <canvas id="frames"></canvas>
    <canvas id="fx"></canvas>
    <div class="fog fog-a"></div>
    <div class="fog fog-b"></div>
    <div class="grade"></div>
    <div class="vignette"></div>
    <div class="grain"></div>
    <div class="letterbox top"></div>
    <div class="letterbox bot"></div>
    <div class="flash" id="flash"></div>
    <div class="ca"></div>
    <p style="position:absolute;top:max(22px,calc(7.2vh + 28px));left:50%;transform:translateX(-50%);z-index:8;font-size:11px;letter-spacing:.48em;text-transform:uppercase;color:#d5d8de;pointer-events:none">AI HACKATHON 2026</p>

    <div id="caption">
      <p class="cap-kicker" id="cap-kicker">00</p>
      <p class="cap-title" id="cap-title">The Foundry</p>
      <p class="cap-line" id="cap-line">A drowned cathedral of steel</p>
    </div>

    <div id="hint">
      <span>Scroll to enter</span>
      <b></b>
    </div>

    <section id="title" aria-hidden="true">
      <div class="title-inner">
        <p class="tagline" id="tagline"><span>Build Beyond Limits</span></p>
      </div>
    </section>
  </div>

  <div id="carnage-wrap">
    <a id="carnage-btn" href="/start">LET'S BEGIN THE CARNAGE</a>
  </div>

  <div id="scroll-track"></div>

  <button type="button" id="audio-btn" class="audio-btn" aria-pressed="false" aria-label="Toggle sound" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path class="sp-on" d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/>
      <path class="sp-off" d="M4 9v6h4l5 4V5L8 9H4zm11.7-3.3 1.4 1.4L15.4 9l1.7 1.9-1.4 1.4L14 10.4l-1.7 1.9-1.4-1.4L12.6 9l-1.7-1.9 1.4-1.4L14 7.6l1.7-1.9z"/>
    </svg>
  </button>

  <script src="js/app.js?v=boot2"></script>
</body>
</html>
